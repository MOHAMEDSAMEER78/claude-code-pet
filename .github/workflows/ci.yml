name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build
        run: swift build -v

  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run tests
        id: run_tests
        run: |
          set -o pipefail
          swift test -v 2>&1 | tee test-output.log
        continue-on-error: true
      - name: Summarize test results
        if: always()
        run: .github/scripts/summarize-tests.sh test-output.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-log
          path: test-output.log
          retention-days: 14
      - name: Fail the job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
