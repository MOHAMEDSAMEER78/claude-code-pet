name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: build and publish
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build app bundle
        run: ./build_app.sh release

      - name: Read version from Info.plist
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Sources/ClaudePet/Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches app version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match CFBundleShortVersionString ${{ steps.version.outputs.version }} - bump Info.plist first."
            exit 1
          fi

      - name: Zip app bundle
        run: |
          mkdir -p release-archives stable-archive
          ditto -c -k --sequesterRsrc --keepParent ClaudePet.app "release-archives/ClaudePet-${{ steps.version.outputs.version }}.zip"
          cp "release-archives/ClaudePet-${{ steps.version.outputs.version }}.zip" "stable-archive/ClaudePet.zip"

      - name: Compute checksum
        id: checksum
        run: |
          shasum -a 256 "release-archives/ClaudePet-${{ steps.version.outputs.version }}.zip" > "release-archives/ClaudePet-${{ steps.version.outputs.version }}.zip.sha256"
          echo "sha256=$(cut -d' ' -f1 "release-archives/ClaudePet-${{ steps.version.outputs.version }}.zip.sha256")" >> "$GITHUB_OUTPUT"

      - name: Update Homebrew cask
        run: |
          sed -i '' "s/^  version \".*\"/  version \"${{ steps.version.outputs.version }}\"/" Casks/claudepet.rb
          sed -i '' "s/^  sha256 \".*\"/  sha256 \"${{ steps.checksum.outputs.sha256 }}\"/" Casks/claudepet.rb

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-archives/ClaudePet-${{ steps.version.outputs.version }}.zip
            release-archives/ClaudePet-${{ steps.version.outputs.version }}.zip.sha256
            stable-archive/ClaudePet.zip
          generate_release_notes: true

      - name: Generate and sign appcast
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_ed_key
          GENERATE_APPCAST=$(find .build/artifacts -type f -name generate_appcast -perm +111 | head -1)
          if [ -z "$GENERATE_APPCAST" ]; then
            echo "generate_appcast tool not found under .build/artifacts" >&2
            exit 1
          fi
          "$GENERATE_APPCAST" --ed-key-file /tmp/sparkle_ed_key \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            release-archives
          rm -f /tmp/sparkle_ed_key
          mkdir -p docs
          cp release-archives/appcast.xml docs/appcast.xml

      - name: Update PR with generated release files
        if: ${{ env.HAS_SPARKLE_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/claudepet.rb docs/appcast.xml 2>/dev/null || git add Casks/claudepet.rb
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          BRANCH="release/generated-updates"
          git checkout -B "$BRANCH"
          git commit -m "Update cask and appcast for ${{ github.ref_name }}"
          git push origin "$BRANCH" --force
          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr create --base main --head "$BRANCH" \
              --title "Update cask and appcast (auto-generated)" \
              --body "Auto-generated by the release workflow. Latest: ${{ github.ref_name }}."
          else
            gh pr edit "$BRANCH" --body "Auto-generated by the release workflow. Latest: ${{ github.ref_name }}."
          fi
